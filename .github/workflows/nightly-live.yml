name: Nightly live acceptance

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    name: Live acceptance against a real Orion deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -z "${{ secrets.ALTERION_ORION_URL }}" ] || [ -z "${{ secrets.ALTERION_API_TOKEN }}" ] || \
             [ -z "${{ secrets.ALTERION_GATEWAY_URL }}" ] || \
             [ -z "${{ secrets.ALTERION_TEST_ACCOUNT_ID }}" ] || [ -z "${{ secrets.ALTERION_TEST_REGION }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping nightly live acceptance: one or more of ALTERION_ORION_URL, ALTERION_API_TOKEN, ALTERION_GATEWAY_URL, ALTERION_TEST_ACCOUNT_ID, ALTERION_TEST_REGION secrets are not set on this repo."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: go test (live acceptance)
        if: steps.secrets.outputs.present == 'true'
        env:
          TF_ACC_LIVE: "1"
          ALTERION_ORION_URL: ${{ secrets.ALTERION_ORION_URL }}
          ALTERION_API_TOKEN: ${{ secrets.ALTERION_API_TOKEN }}
          ALTERION_GATEWAY_URL: ${{ secrets.ALTERION_GATEWAY_URL }}
          ALTERION_TEST_ACCOUNT_ID: ${{ secrets.ALTERION_TEST_ACCOUNT_ID }}
          ALTERION_TEST_REGION: ${{ secrets.ALTERION_TEST_REGION }}
        run: go test ./internal/acceptance_live/... -v -timeout 20m
