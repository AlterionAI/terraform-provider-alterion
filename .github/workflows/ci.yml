name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license key for organization
      # repos. Run the pinned CLI directly instead (same approach as
      # AlterionAI/orion's gitleaks workflow): checksum-verified download,
      # full history on push, the PR's commit range on pull_request.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks
      - name: Run gitleaks (pull_request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: /tmp/gitleaks git --redact --exit-code=1 --log-opts="--no-merges --first-parent ${BASE_SHA}^..${HEAD_SHA}" .
      - name: Run gitleaks (push, full history)
        if: github.event_name != 'pull_request'
        run: /tmp/gitleaks git --redact --exit-code=1 .

  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (unit)
        run: go test ./internal/client/... -v
      - name: go test (acceptance, in-process fake Orion server)
        env:
          TF_ACC: "1"
        run: go test ./internal/provider/... -v
        # These tests never call a real Orion deployment: internal/provider's
        # TestAcc* tests stand up an httptest.Server that fakes the Orion
        # REST contract. terraform-plugin-testing still needs a real
        # `terraform` binary on PATH for protocol handshaking, which
        # setup-terraform below provides.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

  terraform-examples:
    name: terraform fmt/validate on examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive examples/
      - name: terraform init (offline)
        # The aws provider may not resolve without network access to the
        # public Terraform registry in a locked-down CI runner; this step
        # is allowed to fail without failing the workflow. It still runs
        # so a genuine misconfiguration is visible in the logs.
        continue-on-error: true
        working-directory: examples/agentcore
        run: terraform init -backend=false
      - name: terraform validate
        continue-on-error: true
        working-directory: examples/agentcore
        run: terraform validate
